server:
  port: 8088

spring:
  application:
    name: campus

  # 本机开发用的真实口令放 application-local.yml（已被 .gitignore 忽略）。
  # 这个文件不进仓库 —— 克隆下来的人得先 `cp application-local.yml.example
  # application-local.yml` 填上自己的值，否则下面 DB_PASSWORD / JWT_SECRET
  # 两个占位符解析不出来，启动就会报 Could not resolve placeholder。这是有意的。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ===== 数据库（Druid 连接池）=====
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus?serverTimezone=Hongkong&allowMultiQueries=true&useUnicode=true&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    # 只读占位符，不留默认值。原本这里写死 123456 并提交 ——
    # 公开一个「看起来是随手写的」口令，本身比口令泄露更减分。
    password: ${DB_PASSWORD}

  # ===== Redis（本机 Redis 没设密码，所以 password 留空）=====
  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # ===== 文件上传（申诉证据图 / 学生证照片）=====
  # Spring Boot 默认 max-file-size 只有 1MB，不放开的话 5MB 的图在进 Controller 之前
  # 就被容器拒掉了，FileController 里那句「不能超过 5MB」根本轮不到执行。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  global-config:
    db-config:
      # 主键策略：跟随数据库自增
      id-type: auto
  configuration:
    # 在控制台打印执行的 SQL，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== JWT（管理员登录签发 token 用）=====
jwt:
  # 至少要 32 字节（256 位），否则 Keys.hmacShaKeyFor 会抛 WeakKeyException。
  # 本机那串是 46 字符 → 自动选 HS384。
  # 注意这里**没有** `${JWT_SECRET:默认值}` 那个兜底 —— 签名密钥一旦公开，
  # 任何人都能自己签一个合法 token 冒充任意用户，比数据库口令严重得多。
  # 宁可启动时直接报错，也不留一个「反正是默认值」的密钥在仓库里。
  secret: ${JWT_SECRET}
  expiration: 7200000   # 毫秒，= 2 小时

# ===== 图片上传（申诉证据图、学生证照片）=====
campus:
  upload:
    # 落盘目录。相对路径以「启动时的工作目录」为基准，跑 mvn spring-boot:run 时
    # 就是 shixun/ 这一层，所以图片会落在 shixun/uploads/ 下。
    dir: ${CAMPUS_UPLOAD_DIR:uploads}
    # 对外访问前缀。WebConfig 会把它映射成静态资源，前端拿到 /files/2026/10/15/xxx.png
    # 拼上自己的 base-url 就能直接 <image src> 打开。
    url-prefix: /files

# ===== 微信小程序（/auth/wx-login 用 code 换 openid 时用）=====
# 讲义「4、移动端-构建」7.3 节只说了要调微信接口，没给配置。
# 这两个值留空时 /auth/wx-login 会直接返回「后端未配置微信小程序 appid/secret」，
# 不会拿假 openid 糊弄；要用微信一键登录就填上公众平台里那对值。
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
